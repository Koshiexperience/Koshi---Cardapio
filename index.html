<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F3EADB"><title>KOSHI | Cardápio</title><style>
:root{--bg:#F3EADB;--ink:#204846;--muted:#496660;--line:#B9B5A5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}header{text-align:center;padding:55px 15px 36px}h1{font-family:Georgia,serif;letter-spacing:.3em;font-size:clamp(43px,8vw,73px);font-weight:400;margin:0;padding-left:.3em}header p{font-size:11px;letter-spacing:.22em;color:var(--muted)}nav{position:sticky;top:0;z-index:10;background:#F3EADBF5;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:12px;padding:14px;overflow:auto}nav a{color:var(--ink);text-decoration:none;font-size:14px;white-space:nowrap;padding:8px 14px;border:1px solid var(--line);border-radius:30px}main{max-width:1120px;margin:auto;padding:10px 24px 80px}section{padding-top:28px;scroll-margin-top:90px}h2{font-family:Georgia,serif;font-size:31px;font-weight:400;letter-spacing:.08em;border-bottom:1px solid var(--line);padding-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 40px}.dish{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:19px 0;border-bottom:1px solid #20484625;cursor:pointer;min-height:142px}.dish:hover h3{text-decoration:underline}.copy{flex:1;min-width:0}h3{font-size:18px;margin:0 0 9px;font-weight:600}.desc{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 12px}.price{font-size:15px;font-weight:bold}.dish img{width:130px;height:115px;object-fit:cover;border-radius:8px}.dish .noimg{width:60px}footer{text-align:center;border-top:1px solid var(--line);padding:28px;color:var(--muted);font-size:12px}dialog{border:1px solid var(--line);background:#F3EADB;color:var(--ink);border-radius:14px;max-width:480px;width:calc(100% - 32px);padding:25px}dialog::backdrop{background:#000a}dialog h3{font-size:23px}.close{float:right;background:none;border:0;color:var(--ink);font-size:25px;cursor:pointer}.option{padding:11px 0;border-bottom:1px solid #20484625;display:flex;justify-content:space-between;gap:10px}small{color:var(--muted)}@media(max-width:680px){header{padding:36px 10px 25px}main{padding:8px 17px 50px}.grid{grid-template-columns:1fr}.dish img{width:106px;height:100px}nav{justify-content:flex-start;gap:6px}nav a{font-size:12px;padding:7px 11px}h2{font-size:27px}}
</style></head><body><header><h1>KOSHI</h1><p>CULINÁRIA ASIÁTICA · CURITIBA</p><p>Cardápio para consulta e retirada</p></header><nav><a href="#entradas">Entradas</a><a href="#pratos">Pratos</a><a href="#sobremesas">Sobremesas</a><a href="#bebidas">Bebidas</a></nav><main id="content"></main><footer>KOSHI · Os preços apresentados são os informados no iFood · Consulte disponibilidade no balcão</footer><dialog id="details"><button class="close" aria-label="Fechar" onclick="document.getElementById('details').close()">×</button><div id="detailContent"></div></dialog><script>
const items=[{"category":"Entradas","name":"Sunomono","description":"Clássica conserva japonesa de pepino, leve, refrescante e agridoce, finalizada com gergelim. Ótima para abrir o apetite ou acompanhar os pratos principais.","price":19.9,"image":"sunomono","options":null},{"category":"Entradas","name":"Edamame","description":"Vagens de soja cozidas e finalizadas com flor de sal. Simples, leve e viciante — daquelas entradas perfeitas para ir beliscando.","price":21.9,"image":"edamame","options":null},{"category":"Entradas","name":"Kimchi","description":"Acelga fermentada à moda coreana, cheia de sabor, levemente picante e com aquela acidez característica do kimchi. Intenso na medida certa e ótimo como acompanhamento.","price":24.9,"image":"kimchi","options":null},{"category":"Entradas","name":"Gyozas","description":"Recheio de porco, preparados com o toque tailandês do Koshi. Suculentos por dentro e douradinhos por fora.","price":32.9,"image":"gyozas","options":null},{"category":"Entradas","name":"Pork Buns","description":"Bao macio e fofinho recheado com pancetta, kimchi, cebola roxa e molho hoisin. Uma combinação agridoce, levemente picante e cheia de contraste.","price":47.9,"image":"pork","options":null},{"category":"Entradas","name":"Satay Gai","description":"2 Espetinhos de frango marinados com temperos tailandeses, grelhados e servidos com nosso curry Paenang de amendoim. Aromático, cremoso e cheio de sabor.","price":36.9,"image":"sataygai","options":null},{"category":"Entradas","name":"Satay Talai","description":"2 Espetinhos de camarão, lula e polvo preparados ao estilo tailandês e servidos com nosso curry Paenang de amendoim. Mar, brasa e sabores intensos no mesmo prato.","price":46.9,"image":"sataytalai","options":null},{"category":"Entradas","name":"Yakitori Pancetta","description":"2 Espetinhos de pancetta preparados ao estilo japonês, dourados e suculentos, acompanhados de um molho japonês de goiabada, agridoce e cheio de personalidade. Uma combinação diferente que funciona demais.","price":36.9,"image":"yakitori","options":null},{"category":"Pratos","name":"Núea Wua Sapparod","description":"Mignon com abacaxi e gengibre, envolvido em molho de ostra e flambado no whisky. Leva castanha de caju e é finalizado com moyashi e manjericão. Agridoce, aromático e cheio de contrastes.","price":81.9,"image":"nuea","options":null},{"category":"Pratos","name":"Karê","description":"Servido com arroz japonês e nosso karê: o clássico curry japonês, encorpado, aromático e levemente adocicado. Comfort food japonesa de respeito.","price":52.9,"image":"kare","options":[["Karê Veg",52.9],["Tonkatsu Karê",67.9]]},{"category":"Pratos","name":"Pad Thai","description":"Macarrão de arroz salteado na wok, vegetais, brotos, amendoim e nosso molho agridoce de Pad Thai, finalizado com limão. Um clássico thai cheio de textura e sabor.","price":52.9,"image":"padthai","options":[["Vegetariano",52.9],["Frango",62.9],["Porco",64.9],["Camarão",79.9]]},{"category":"Pratos","name":"Khao Pad","description":"Arroz tailandês frito na wok com vegetais, ovo e temperos asiáticos. Aromático, soltinho e com aquele sabor tostado que só a wok bem quente entrega.","price":47.9,"image":"khaopad","options":[["Vegetariano",47.9],["Frango",52.9],["Porco",55.9],["Camarão",79.9]]},{"category":"Pratos","name":"Curry Vermelho","description":"Curry vermelho tailandês cremoso, preparado com leite de coco, vegetais e ervas, acompanhado de arroz. Aromático, levemente adocicado e picante na medida.","price":52.9,"image":"curry","options":[["Vegetariano",52.9],["Frango",57.9],["Porco",59.9],["Camarão",82.9]]},{"category":"Sobremesas","name":"Gulab Jamun","description":"Bolinhas macias e delicadas de leite, mergulhadas em uma calda aromática de cardamomo, servidas com iogurte, lascas crocantes de amêndoas e raspas de limão. Uma sobremesa que mistura doçura, acidez, cremosidade e crocância em cada colherada.","price":22.9,"image":"gulab","options":null},{"category":"Bebidas","name":"Água mineral sem gás 510 ml","description":"Acqua Bonna.","price":5,"image":null,"options":null},{"category":"Bebidas","name":"Água mineral com gás 500 ml","description":"Acqua Bonna.","price":6,"image":null,"options":null},{"category":"Bebidas","name":"Coca-Cola 350 ml","description":"","price":8,"image":null,"options":null},{"category":"Bebidas","name":"Coca-Cola Zero 350 ml","description":"","price":8,"image":null,"options":null},{"category":"Bebidas","name":"Guaraná 350 ml","description":"","price":8,"image":null,"options":null},{"category":"Bebidas","name":"Guaraná Zero 350 ml","description":"","price":8,"image":null,"options":null},{"category":"Bebidas","name":"Spaten 350 ml","description":"Venda somente para maiores de 18 anos.","price":11.9,"image":null,"options":null}];
const fmt=n=>n==null?'Preço a confirmar':n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const main=document.getElementById('content');
for(const category of ['Entradas','Pratos','Sobremesas','Bebidas']){const sec=document.createElement('section');sec.id=category.toLowerCase();const h=document.createElement('h2');h.textContent=category;sec.append(h);const grid=document.createElement('div');grid.className='grid';items.filter(x=>x.category===category).forEach(item=>{const d=document.createElement('article');d.className='dish';d.tabIndex=0;d.setAttribute('role','button');const c=document.createElement('div');c.className='copy';const name=document.createElement('h3');name.textContent=item.name;const desc=document.createElement('p');desc.className='desc';desc.textContent=item.description;const price=document.createElement('div');price.className='price';price.textContent=(item.options?'A partir de ':'')+fmt(item.price);c.append(name,desc,price);d.append(c);if(item.image){const img=document.createElement('img');img.src=item.image+'.jpg';img.alt=item.name;img.loading='lazy';d.append(img)}d.onclick=()=>show(item);d.onkeydown=e=>{if(e.key==='Enter')show(item)};grid.append(d)});sec.append(grid);main.append(sec)}
function show(item){const el=document.getElementById('detailContent');el.replaceChildren();const h=document.createElement('h3');h.textContent=item.name;const p=document.createElement('p');p.textContent=item.description;el.append(h,p);if(item.options){const subtitle=document.createElement('p');subtitle.textContent='Opções disponíveis:';el.append(subtitle);for(const [name,price] of item.options){const row=document.createElement('div');row.className='option';const n=document.createElement('span');n.textContent=name;const v=document.createElement('strong');v.textContent=fmt(price);row.append(n,v);el.append(row)}}else{const price=document.createElement('strong');price.textContent=fmt(item.price);el.append(price)}if(['Pad Thai','Khao Pad','Curry Vermelho'].includes(item.name)){const p=document.createElement('p');p.innerHTML='<small>Níveis de pimenta: suave · médio · forte (solicite no balcão).</small>';el.append(p)}document.getElementById('details').showModal()}
</script></body></html>
